name: Android CI

on:
  push:
    branches: [ main, master, dev ]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # 单元测试（纯 JVM，无模拟器）
      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --console=plain --no-daemon

      # Debug 编译（含 kapt/Hilt/Room 全链路）
      - name: Assemble debug
        run: ./gradlew :app:assembleDebug --console=plain --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: hita-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
