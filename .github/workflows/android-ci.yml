name: Android CI

on:
  push:
    branches: [ main, master, dev ]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Repository and documentation checks
        run: |
          python3 scripts/test_check_repository.py
          python3 scripts/check_repository.py

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # 单元测试（纯 JVM，无模拟器）
      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --console=plain --no-daemon

      # Debug 编译（含 kapt/Hilt/Room 全链路）
      - name: Assemble debug
        run: ./gradlew :app:assembleDebug --console=plain --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: hita-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  pdf-resources:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: default
          disable-animations: true
          script: ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=cn.limpu.hita.agent.document.PdfResourceInstrumentedTest --console=plain --no-daemon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pdf-resource-test-results
          path: app/build/outputs/androidTest-results/connected/
